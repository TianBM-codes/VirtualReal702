<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modal Sync Demo — 试验网格 / FEM 同步动画</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d1117; color: #c9d1d9;
                 font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; }
    #app { display: flex; height: 100%; }
    #panel { width: 300px; padding: 12px; box-sizing: border-box; overflow-y: auto;
             background: #161b22; border-right: 1px solid #30363d; flex-shrink: 0; }
    #viewport { flex: 1; position: relative; }
    #viewport canvas { display: block; }
    label { display: block; margin-top: 8px; color: #8b949e; }
    input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 4px 6px;
             background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; }
    button { margin: 10px 6px 0 0; padding: 5px 14px; border: none; border-radius: 4px;
             background: #21262d; color: #c9d1d9; cursor: pointer; }
    button.primary { background: #1f6feb; color: #fff; }
    button:disabled { opacity: 0.4; cursor: default; }
    #status { margin-top: 12px; padding: 8px; background: #0d1117; border-radius: 4px;
              white-space: pre-wrap; word-break: break-all; min-height: 80px; }
    .warn { color: #d29922; }
    .err { color: #f85149; }
    h3 { margin: 0 0 4px; font-size: 14px; }
    .hint { color: #8b949e; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="panel">
      <h3>试验网格 / FEM 同步动画</h3>
      <div class="hint">独立 demo,不影响主 viewer。橙色线框=试验网格,蓝色=FEM 模型,同一帧计数器驱动。</div>

      <label>后端地址</label>
      <input type="text" id="baseUrl" value="http://127.0.0.1:5000" />
      <label>Project ID</label>
      <input type="text" id="projectId" value="" />
      <label>Result Group(可选,OP2 结果组)</label>
      <input type="text" id="resultGroup" value="" />
      <label>试验模态阶次 order</label>
      <input type="number" id="order" value="1" min="0" />
      <label>FEM 帧号(留空 = order-1)</label>
      <input type="text" id="femFrame" value="" />
      <label>动画帧数 n_frames</label>
      <input type="number" id="nFrames" value="20" min="4" max="120" />
      <label>coefficient(越大变形越小)</label>
      <input type="number" id="coefficient" value="1.0" step="0.1" />
      <label><input type="checkbox" id="flip" /> 试验振型翻转(flip)</label>
      <label>播放速度(周期/秒)</label>
      <input type="number" id="speed" value="1.0" step="0.25" />

      <div>
        <button class="primary" id="btnLoad">加载</button>
        <button id="btnPlay" disabled>播放</button>
        <button id="btnPause" disabled>暂停</button>
        <button id="btnStop" disabled>复位</button>
      </div>

      <div id="status">未加载。</div>
    </div>
    <div id="viewport"></div>
  </div>
  <script type="module" src="./src/modules/modal-sync/demo/main.js"></script>
</body>
</html>
