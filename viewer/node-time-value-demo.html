<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Node Time Value Demo — 按时间查节点值</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d1117; color: #c9d1d9;
                 font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; }
    #app { display: flex; height: 100%; }
    #panel { width: 320px; padding: 12px; box-sizing: border-box; overflow-y: auto;
             background: #161b22; border-right: 1px solid #30363d; flex-shrink: 0; }
    #result { flex: 1; padding: 16px; box-sizing: border-box; overflow: auto; }
    label { display: block; margin-top: 8px; color: #8b949e; }
    input[type=text], input[type=number], select {
             width: 100%; box-sizing: border-box; padding: 4px 6px;
             background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; }
    button { margin: 10px 6px 0 0; padding: 5px 14px; border: none; border-radius: 4px;
             background: #21262d; color: #c9d1d9; cursor: pointer; }
    button.primary { background: #1f6feb; color: #fff; }
    button:disabled { opacity: 0.4; cursor: default; }
    .radio-row { margin-top: 6px; }
    .radio-row label { display: inline-block; margin: 0 10px 0 2px; color: #c9d1d9; }
    #status { margin-top: 12px; padding: 8px; background: #0d1117; border-radius: 4px;
              white-space: pre-wrap; word-break: break-all; min-height: 60px; font-size: 12px; }
    .warn { color: #d29922; }
    .err { color: #f85149; }
    .okc { color: #3fb950; }
    h3 { margin: 0 0 4px; font-size: 14px; }
    .hint { color: #8b949e; font-size: 12px; }
    table { border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #30363d; padding: 4px 10px; text-align: right;
             font-variant-numeric: tabular-nums; }
    th { background: #161b22; color: #8b949e; }
    td.miss { color: #f85149; text-align: center; }
    #meta-summary { margin-top: 8px; color: #8b949e; font-size: 12px; white-space: pre-wrap; }
    pre { background: #161b22; padding: 10px; border-radius: 4px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="panel">
      <h3>按时间查节点值</h3>
      <div class="hint">测试 POST /api/odb/{id}/results/node-time-value。独立页面,不影响主 viewer。</div>

      <label>后端地址</label>
      <input type="text" id="baseUrl" value="http://127.0.0.1:5000" />
      <label>Project ID / ODB ID</label>
      <input type="text" id="odbId" value="" />
      <label>Result Group(project 模式必填)</label>
      <input type="text" id="resultGroup" value="" />

      <button id="btnMeta">加载元数据</button>
      <div id="meta-summary"></div>

      <label>Instance</label>
      <select id="instance"></select>
      <label>Step(留空 = 全局时间)</label>
      <select id="step"><option value="">（全局时间）</option></select>
      <label>Field(NODAL,按上面 instance/step 过滤)</label>
      <select id="field"></select>
      <label>节点 label(逗号/空格分隔)</label>
      <input type="text" id="nodeLabels" value="" placeholder="选 instance 后自动预填" />
      <div class="hint" id="node-hint"></div>
      <label>时间 time</label>
      <input type="number" id="time" value="0.5" step="any" />
      <label>时间匹配策略</label>
      <div class="radio-row">
        <input type="radio" name="tm" id="tm-prev" value="prev"><label for="tm-prev">前一帧</label>
        <input type="radio" name="tm" id="tm-next" value="next"><label for="tm-next">后一帧</label>
        <input type="radio" name="tm" id="tm-interp" value="interp" checked><label for="tm-interp">插值</label>
      </div>

      <button class="primary" id="btnQuery">查询</button>
      <div id="status">就绪。先填 Project ID,点"加载元数据"可自动列出 instance/step/field。</div>
    </div>
    <div id="result">
      <h3>结果</h3>
      <div id="frames-info" class="hint"></div>
      <div id="table-holder"></div>
      <h3 style="margin-top:16px">原始响应</h3>
      <pre id="raw">-</pre>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const status = (msg, cls) => { const el = $("status"); el.textContent = msg; el.className = cls || ""; };

    function apiBase() {
      const base = $("baseUrl").value.replace(/\/+$/, "");
      const odb = encodeURIComponent($("odbId").value.trim());
      return `${base}/api/odb/${odb}`;
    }
    function rgQuery(sep) {
      const rg = $("resultGroup").value.trim();
      return rg ? `${sep || "?"}result_group=${encodeURIComponent(rg)}` : "";
    }

    // overview 缓存:steps 列表(算全局时间的交集用) + 各 field 的 invariants(展示用,
    // GET /fields 不返回 invariants)
    let metaSteps = [];
    let overviewInvariants = {};
    let globalTimeRange = null;   // overview 顶层 global_time_range,给"（全局时间）"选项标范围

    // 区间显示成 [min,max];数值过长时截断,避免下拉框里一行放不下
    const fmtNum = (v) => Number.isInteger(v) ? String(v) : Number(v.toPrecision(6)).toString();
    const fmtRange = (r) => r ? `[${fmtNum(r.min)},${fmtNum(r.max)}]` : "无";

    // ── 元数据:meta/overview 填充 instance/step 下拉框 ────────────────────────
    $("btnMeta").onclick = async () => {
      if (!$("odbId").value.trim()) { status("请先填 Project ID / ODB ID", "err"); return; }
      status("加载元数据…");
      try {
        const resp = await fetch(`${apiBase()}/meta/overview${rgQuery()}`);
        const body = await resp.json();
        if (!resp.ok || body.code !== 200) throw new Error(body.message || `HTTP ${resp.status}`);
        const d = body.data || {};
        const instances = d.instances || [];
        metaSteps = d.steps || [];
        globalTimeRange = d.global_time_range || null;
        overviewInvariants = {};
        for (const f of d.fields || []) overviewInvariants[f.field_name] = f.invariants || [];

        $("instance").innerHTML = instances.map(i =>
          `<option>${i.instance_name}</option>`).join("");
        // 下拉框里直接标出 time 的合法区间(来自 overview 的 time_range /
        // global_time_range),填时间前先看范围,不用试错。FREQUENCY/BUCKLE 的
        // 区间是模态阶次/频率(time_axis=mode),不是秒,所以额外标注一下。
        const globalLabel = globalTimeRange
          ? `（全局时间 ${fmtRange(globalTimeRange)}）`
          : `（全局时间 — 无 STATIC/DYNAMIC step,不可用）`;
        $("step").innerHTML = `<option value="">${globalLabel}</option>` + metaSteps.map(s => {
          const unit = s.time_axis === "mode" ? " 阶次/频率" : "";
          return `<option value="${s.step_name}">${s.step_name} (${s.procedure}, ` +
                 `${fmtRange(s.time_range)}${unit})</option>`;
        }).join("");
        $("meta-summary").textContent =
          `${instances.length} instance / ${metaSteps.length} step`;
        status("元数据已加载。", "okc");
        await refreshFields();
        await refreshNodeHint();
      } catch (e) { status(`加载失败:${e.message}`, "err"); }
    };

    // ── 字段列表:按 instance + step 精确过滤(GET /fields)────────────────────
    // overview 的 fields 是跨所有 step 汇总的,直接用会选出该 step 下不存在的
    // 组合(接口按 result_blocks 校验会报 400),所以这里改用逐 step 查询。
    async function fetchStepFields(instance, step) {
      const url = `${apiBase()}/fields?instance=${encodeURIComponent(instance)}` +
                  `&step=${encodeURIComponent(step)}${rgQuery("&")}`;
      const resp = await fetch(url);
      const body = await resp.json();
      if (!resp.ok || body.code !== 200) throw new Error(body.message || `HTTP ${resp.status}`);
      return (body.data.fields || []).filter(f => (f.positions || []).includes("NODAL"));
    }

    async function refreshFields() {
      const instance = $("instance").value;
      if (!instance) { $("field").innerHTML = ""; return; }
      const step = $("step").value;
      const prev = $("field").value;
      status("加载字段列表…");
      try {
        let fields;
        if (step) {
          fields = await fetchStepFields(instance, step);
        } else {
          // 全局时间只串联有时间语义的 step,且插值可能跨 step,取各 step 字段
          // 的交集才保证任意 time 都可查。哪些 step 参与全局轴不在这里自己判,
          // 直接用 overview 标好的 global_time_range(后端口径,改规则不用改这里)
          const timeSteps = metaSteps.filter(s => s.global_time_range);
          if (!timeSteps.length) {
            $("field").innerHTML = "";
            status("没有 STATIC/DYNAMIC step,全局时间不可用,请选具体 step", "warn");
            return;
          }
          const perStep = await Promise.all(
            timeSteps.map(s => fetchStepFields(instance, s.step_name)));
          fields = perStep.reduce((acc, list) => {
            const names = new Set(list.map(f => f.name));
            return acc.filter(f => names.has(f.name));
          });
        }
        $("field").innerHTML = fields.map(f => {
          const inv = (overviewInvariants[f.name] || []).length
            ? ` +${overviewInvariants[f.name].join("/")}` : "";
          return `<option value="${f.name}">${f.name} [${(f.components || []).join(",") || "标量"}]${inv}</option>`;
        }).join("");
        if (fields.some(f => f.name === prev)) $("field").value = prev;
        status(fields.length
          ? `${fields.length} 个可查字段(已按 instance/step 过滤)。`
          : "该 instance/step 组合下没有 NODAL 字段。", fields.length ? "okc" : "warn");
      } catch (e) { status(`字段列表加载失败:${e.message}`, "err"); }
    }

    // ── 节点号提示:GET /geometry/{instance}/node-labels ──────────────────────
    // 节点编号不一定从 1 开始(常见部件偏移如 30050001 起),
    // 展示真实范围并预填前几个,避免瞎猜 label 查出一排 found=false
    async function refreshNodeHint() {
      const inst = $("instance").value;
      const hint = $("node-hint");
      if (!inst) { hint.textContent = ""; return; }
      try {
        const resp = await fetch(
          `${apiBase()}/geometry/${encodeURIComponent(inst)}/node-labels?limit=5`);
        const body = await resp.json();
        if (!resp.ok || body.code !== 200) throw new Error(body.message || `HTTP ${resp.status}`);
        const d = body.data;
        hint.textContent = `共 ${d.total} 个节点,编号 ${d.label_min} ~ ${d.label_max}`;
        if (!$("nodeLabels").value.trim())
          $("nodeLabels").value = d.labels.slice(0, 3).join(", ");
      } catch (e) { hint.textContent = `节点列表加载失败:${e.message}`; }
    }

    $("instance").onchange = () => { refreshFields(); refreshNodeHint(); };
    $("step").onchange = refreshFields;

    // ── 查询 ──────────────────────────────────────────────────────────────────
    $("btnQuery").onclick = async () => {
      const labels = $("nodeLabels").value.split(/[\s,;]+/).filter(Boolean).map(Number);
      if (!$("odbId").value.trim()) { status("请先填 Project ID / ODB ID", "err"); return; }
      if (!labels.length || labels.some(isNaN)) { status("节点 label 格式不对", "err"); return; }
      const bodyReq = {
        instance: $("instance").value,
        field: $("field").value,
        node_labels: labels,
        time: parseFloat($("time").value),
        step: $("step").value || null,
        time_match: document.querySelector("input[name=tm]:checked").value,
        result_group: $("resultGroup").value.trim() || null,
      };
      status("查询中…");
      $("raw").textContent = "-"; $("table-holder").innerHTML = ""; $("frames-info").textContent = "";
      try {
        const resp = await fetch(`${apiBase()}/results/node-time-value`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bodyReq),
        });
        const body = await resp.json();
        $("raw").textContent = JSON.stringify(body, null, 2);
        if (!resp.ok || body.code !== 200) throw new Error(body.message || `HTTP ${resp.status}`);
        render(body.data);
        status("查询成功。", "okc");
      } catch (e) { status(`查询失败:${e.message}`, "err"); }
    };

    function render(d) {
      const fu = (d.frames_used || []).map(f => {
        const t = d.time_mode === "global" ? `全局 ${f.global_time}` : `step 内 ${f.step_time}`;
        return `${f.step} / 帧 ${f.frame_idx}(${t},权重 ${f.weight})`;
      }).join(" + ");
      $("frames-info").textContent =
        `解析方式:${d.resolved_mode} | 时间口径:${d.time_mode === "global" ? "全局" : "step 内局部"}` +
        ` | 使用帧:${fu} | 时间范围 [${d.time_range.min}, ${d.time_range.max}]`;

      const cols = [...(d.components || []), ...(d.invariants || [])];
      const head = `<tr><th>节点</th>${cols.map(c => `<th>${c}</th>`).join("")}</tr>`;
      const rows = (d.nodes || []).map(n => {
        if (!n.found) return `<tr><td>${n.label}</td><td class="miss" colspan="${cols.length}">不在该 instance</td></tr>`;
        return `<tr><td>${n.label}</td>${cols.map(c => {
          const v = n.values[c];
          return `<td>${v === null || v === undefined ? "—" : Number(v).toPrecision(6)}</td>`;
        }).join("")}</tr>`;
      }).join("");
      $("table-holder").innerHTML = `<table>${head}${rows}</table>`;
    }
  </script>
</body>
</html>
