<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>模态振型查看器</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex; height: 100vh; overflow: hidden;
      background: #0d1117; color: #c9d1d9;
      font-family: 'Consolas', 'Menlo', monospace; font-size: 13px;
    }

    /* ── 左侧面板 ─────────────────────────────── */
    #panel {
      width: 270px; min-width: 270px;
      background: #161b22; border-right: 1px solid #30363d;
      display: flex; flex-direction: column;
      overflow-y: auto; padding: 12px 10px; gap: 8px;
    }
    #panel h1 { font-size: 14px; color: #58a6ff; letter-spacing: 1px;
                padding-bottom: 6px; border-bottom: 1px solid #30363d; }

    .card { background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
            padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
    .card h2 { font-size: 11px; text-transform: uppercase; color: #8b949e; letter-spacing: .5px; }
    .info-row { display: flex; justify-content: space-between; font-size: 11px; }
    .info-row span:first-child { color: #8b949e; }

    label { font-size: 11px; color: #8b949e; }
    input[type="text"], select {
      width: 100%; background: #21262d; border: 1px solid #30363d;
      border-radius: 4px; color: #c9d1d9; padding: 4px 6px;
      font-size: 12px; font-family: inherit; outline: none;
    }
    input[type="text"]:focus, select:focus { border-color: #58a6ff; }
    input[type="range"] { width: 100%; accent-color: #58a6ff; }

    button { background: #21262d; border: 1px solid #30363d; border-radius: 4px;
             color: #c9d1d9; padding: 5px 10px; font-size: 12px;
             font-family: inherit; cursor: pointer; transition: background .15s; }
    button:hover { background: #30363d; }
    button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    button.primary:hover { background: #388bfd; }
    button:disabled { opacity: .4; cursor: not-allowed; }

    /* 视图模式选项卡 */
    .tab-group { display: flex; gap: 4px; }
    .tab-group button { flex: 1; padding: 4px; font-size: 11px; }
    .tab-group button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }

    /* 图例 */
    #legendBar { width: 100%; height: 14px; border-radius: 3px; border: 1px solid #30363d; }
    .legend-labels { display: flex; justify-content: space-between; font-size: 10px; color: #8b949e; }

    #status { font-size: 11px; color: #8b949e; border-top: 1px solid #30363d;
              padding-top: 6px; min-height: 20px; word-break: break-all; }
    #status.err { color: #f85149; }
    #status.ok  { color: #3fb950; }

    /* ── 3D 视口 ──────────────────────────────── */
    #viewport { flex: 1; position: relative; overflow: hidden; }
    #canvas   { display: block; width: 100%; height: 100%; }
    #hint { position: absolute; bottom: 10px; right: 12px; font-size: 10px;
            color: #484f58; pointer-events: none; }
    #modeLabel {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      font-size: 13px; color: #e3b341; pointer-events: none;
      text-shadow: 0 1px 3px #000; white-space: nowrap;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

<div id="panel">
  <h1>◈ 模态振型查看器</h1>

  <!-- 连接 -->
  <div class="card">
    <h2>连接</h2>
    <label>API 地址</label>
    <input type="text" id="baseUrl" value="http://127.0.0.1:8000" />
  </div>

  <!-- 加载模型 -->
  <div class="card">
    <h2>加载模型</h2>
    <label>JSON 文件路径（服务器端绝对路径）</label>
    <input type="text" id="jsonPath" placeholder="/path/to/modal.json" />
    <button class="primary" id="btnLoad">Load</button>
  </div>

  <!-- 模型信息 -->
  <div class="card" id="infoCard" style="display:none">
    <h2>模型信息</h2>
    <div class="info-row"><span>Model ID</span><span id="iModelId">—</span></div>
    <div class="info-row"><span>模态阶数</span><span id="iModes">—</span></div>
  </div>

  <!-- 控制 -->
  <div class="card" id="ctrlCard" style="display:none">
    <h2>控制</h2>

    <label>模态阶次</label>
    <select id="modeSelect"></select>

    <label>模态分量</label>
    <select id="componentSelect"></select>

    <label>显示模式</label>
    <div class="tab-group">
      <button class="tab" data-view="original" >原始模型</button>
      <button class="tab active" data-view="deformed">变形振型</button>
      <button class="tab" data-view="colormap" >云图振型</button>
    </div>

    <div id="scaleRow" style="display:flex;flex-direction:column;gap:4px">
      <label>变形倍率：<span id="scaleVal">1.00</span> × (自然缩放)</label>
      <input type="range" id="scaleSlider" min="0" max="3" step="0.01" value="1" />
    </div>
  </div>

  <!-- 图例 -->
  <div class="card" id="legendCard" style="display:none">
    <h2>云图图例</h2>
    <canvas id="legendBar" width="240" height="14"></canvas>
    <div class="legend-labels">
      <span id="legendMin">—</span>
      <span id="legendMid">—</span>
      <span id="legendMax">—</span>
    </div>
  </div>

  <div id="status">填写 JSON 路径后点击 Load。</div>
</div>

<div id="viewport">
  <canvas id="canvas"></canvas>
  <div id="modeLabel"></div>
  <div id="hint">左键旋转 | 右键平移 | 滚轮缩放</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── 全局状态 ──────────────────────────────────────────────────────────────
let BASE     = 'http://127.0.0.1:8000';
let MODEL_ID = null;

// 几何数据（加载一次）
let originPos = null;   // Float32Array [N*3] — 原始节点坐标
let indexArr  = null;   // Int32Array (flat triangles) — 三角形索引
let edgesArr  = null;   // Int32Array (flat [E*2]) — 原始 quad 边，用于线框

// 振型缓存：order → {real, imag, scaleFactor}
const animCache = {};

// 下拉内容
let modesList  = [];     // [{label, value(=order)}]
let compLabels = [];     // ["U-Modulus:usum", "DOF UX", ...]

// 当前状态
let viewMode = 'deformed';
let curOrder = 1;
let curComp  = 'usum';
let curScale = 1.0;      // 相对于 scaleFactor 的倍率（1.0 = 服务端自然缩放）

// Three.js 对象
let renderer, scene, camera, controls, mesh, wireMesh;
let posAttr   = null;   // BufferAttribute — 位置 [N × 3]（mesh 和 wireMesh 共享）
let colorAttr = null;   // BufferAttribute — 颜色 [N × 3]  (float RGB)

// ── DOM 快捷 ──────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function setStatus(msg, type = '') {
  $('status').textContent = msg;
  $('status').className   = type;
}
function fmtNum(v) {
  return (typeof v === 'number') ? v.toExponential(3) : String(v);
}

// ── 分量映射（前端下拉标签 → 内部码）──────────────────────────────────────
const COMP_MAP = {
  'usum': 'usum', 'U-Modulus:usum': 'usum',
  'ux':   'ux',   'DOF UX': 'ux',
  'uy':   'uy',   'DOF UY': 'uy',
  'uz':   'uz',   'DOF UZ': 'uz',
};

// ── Jet 颜色计算 ──────────────────────────────────────────────────────────
function jetRGB(t) {
  // 标准 jet colormap，t ∈ [0, 1]
  const r = Math.min(1, Math.max(0, 1.5 - Math.abs(4 * t - 3)));
  const g = Math.min(1, Math.max(0, 1.5 - Math.abs(4 * t - 2)));
  const b = Math.min(1, Math.max(0, 1.5 - Math.abs(4 * t - 1)));
  return [r, g, b];
}

// ── 客户端分量计算（从 real/imag 算每节点幅值）───────────────────────────
function computeComponentVals(real, imag, comp) {
  const N    = real.length / 3;
  const vals = new Float32Array(N);
  for (let j = 0; j < N; j++) {
    const rx = real[j*3], ry = real[j*3+1], rz = real[j*3+2];
    const ix = imag[j*3], iy = imag[j*3+1], iz = imag[j*3+2];
    const ux = Math.sqrt(rx*rx + ix*ix);
    const uy = Math.sqrt(ry*ry + iy*iy);
    const uz = Math.sqrt(rz*rz + iz*iz);
    if      (comp === 'ux')   vals[j] = ux;
    else if (comp === 'uy')   vals[j] = uy;
    else if (comp === 'uz')   vals[j] = uz;
    else                      vals[j] = Math.sqrt(ux*ux + uy*uy + uz*uz); // usum
  }
  return vals;
}

// ── Three.js 初始化 ───────────────────────────────────────────────────────
function initThree() {
  const canvas = $('canvas');
  const vp     = $('viewport');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(vp.clientWidth, vp.clientHeight);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1117);

  camera = new THREE.PerspectiveCamera(45, vp.clientWidth / vp.clientHeight, 0.001, 100000);
  camera.position.set(0.5, 0.5, 3);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  new ResizeObserver(() => {
    renderer.setSize(vp.clientWidth, vp.clientHeight);
    camera.aspect = vp.clientWidth / vp.clientHeight;
    camera.updateProjectionMatrix();
  }).observe(vp);

  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();
}

function fitCamera() {
  if (!mesh) return;
  const box = new THREE.Box3().setFromObject(mesh);
  const c = new THREE.Vector3(), s = new THREE.Vector3();
  box.getCenter(c); box.getSize(s);
  const d = Math.max(s.x, s.y, s.z);
  camera.position.copy(c).add(new THREE.Vector3(0, 0, d * 2.2));
  camera.near = d * 0.001; camera.far = d * 100;
  camera.updateProjectionMatrix();
  controls.target.copy(c); controls.update();
}

// ── 建立 Three.js indexed mesh（只建一次）────────────────────────────────
function buildMesh() {
  if (mesh)     { scene.remove(mesh);     mesh.geometry.dispose();     mesh.material.dispose(); }
  if (wireMesh) { scene.remove(wireMesh); wireMesh.geometry.dispose(); wireMesh.material.dispose(); }

  const N   = originPos.length / 3;

  posAttr   = new THREE.BufferAttribute(originPos.slice(), 3);
  colorAttr = new THREE.BufferAttribute(new Float32Array(N * 3).fill(0.4), 3);

  // 面网格（带颜色）
  const faceGeo = new THREE.BufferGeometry();
  faceGeo.setAttribute('position', posAttr);
  faceGeo.setAttribute('color',    colorAttr);
  faceGeo.setIndex(new THREE.BufferAttribute(new Uint32Array(indexArr), 1));
  faceGeo.computeVertexNormals();
  mesh = new THREE.Mesh(faceGeo, new THREE.MeshBasicMaterial({
    vertexColors: true, side: THREE.DoubleSide,
  }));
  scene.add(mesh);

  // 线框：用原始 quad 边（edgesArr），与面共享 posAttr，自动跟着变形
  const wireGeo = new THREE.BufferGeometry();
  wireGeo.setAttribute('position', posAttr);   // 共享！更新 posAttr 线框也动
  wireGeo.setIndex(new THREE.BufferAttribute(new Uint32Array(edgesArr), 1));
  wireMesh = new THREE.LineSegments(wireGeo, new THREE.LineBasicMaterial({ color: 0x1a2535 }));
  scene.add(wireMesh);

  fitCamera();
}

// ── 获取并缓存振型（real/imag + scaleFactor）─────────────────────────────
// 同时请求 /animation 和 /deformed，后者提供服务端计算的 scaleFactor
// scaleFactor 的含义：乘以 real 后，最大位移幅值 = 模型尺寸的约 10%
async function fetchAnim(order) {
  if (animCache[order]) return animCache[order];

  const [animRes, defRes] = await Promise.all([
    fetch(`${BASE}/api/modal/${MODEL_ID}/animation?order=${order}`),
    fetch(`${BASE}/api/modal/${MODEL_ID}/deformed?order=${order}&max_scalar_size=0.1&coefficient=1`),
  ]);
  const animBody = await animRes.json();
  const defBody  = await defRes.json();
  if (!animRes.ok) throw new Error(animBody.detail || `HTTP ${animRes.status}`);
  if (!defRes.ok)  throw new Error(defBody.detail  || `HTTP ${defRes.status}`);

  animCache[order] = {
    real:        new Float32Array(animBody.data.real),
    imag:        new Float32Array(animBody.data.imag),
    scaleFactor: defBody.data.scaleFactor,   // 服务端自然缩放系数
  };
  return animCache[order];
}

// ── 核心：根据当前状态更新视图 ────────────────────────────────────────────
async function applyView() {
  if (!MODEL_ID || !mesh) return;

  try {
    if (viewMode === 'original') {
      resetPos();
      fillGray();
      $('legendCard').style.display = 'none';
      $('modeLabel').textContent = '原始模型';

    } else {
      // 'deformed' 或 'colormap' — 都需要 real/imag
      setStatus('加载振型数据…');
      const anim = await fetchAnim(curOrder);
      const comp = COMP_MAP[curComp] || 'usum';

      if (viewMode === 'deformed') {
        applyDeformedPos(anim.real, anim.scaleFactor * curScale);
      } else {
        resetPos();
      }

      const mLabel = modesList.find(m => m.value === curOrder)?.label || `Order ${curOrder}`;

      if (curOrder === 0) {
        // Undeformed：灰色，不显示图例
        fillGray();
        $('legendCard').style.display = 'none';
        $('modeLabel').textContent = 'Undeformed';
      } else {
        const vals = computeComponentVals(anim.real, anim.imag, comp);
        const vmin = Math.min(...vals);
        const vmax = Math.max(...vals);
        applyJetColors(vals, vmin, vmax);
        drawLegend(vmin, vmax);
        $('legendCard').style.display = 'flex';
        $('modeLabel').textContent = viewMode === 'deformed'
          ? `${mLabel}  ×${curScale.toFixed(2)}`
          : `${mLabel}  ${comp.toUpperCase()}`;
      }
    }

    posAttr.needsUpdate   = true;
    colorAttr.needsUpdate = true;
    mesh.geometry.computeVertexNormals();

  } catch (e) {
    setStatus('视图更新失败：' + e.message, 'err');
    return;
  }

  const mLabel = modesList.find(m => m.value === curOrder)?.label || `Order ${curOrder}`;
  setStatus(`${mLabel} | ${COMP_MAP[curComp]||curComp} | ${viewMode}`, 'ok');
}

// ── 位置 / 颜色写入辅助 ───────────────────────────────────────────────────
function resetPos() {
  const pa = posAttr.array;
  for (let i = 0; i < pa.length; i++) pa[i] = originPos[i];
}

function applyDeformedPos(real, scale) {
  const pa = posAttr.array;
  for (let i = 0; i < pa.length; i++) pa[i] = originPos[i] + real[i] * scale;
}

function fillGray() {
  const ca = colorAttr.array;
  for (let i = 0; i < ca.length; i += 3) { ca[i] = 0.3; ca[i+1] = 0.4; ca[i+2] = 0.55; }
}

function applyJetColors(vals, vmin, vmax) {
  const ca   = colorAttr.array;
  const span = vmax - vmin;
  for (let j = 0; j < vals.length; j++) {
    const t = span > 1e-30 ? (vals[j] - vmin) / span : 0;
    const [r, g, b] = jetRGB(t);
    ca[j*3] = r; ca[j*3+1] = g; ca[j*3+2] = b;
  }
}

function drawLegend(vMin, vMax) {
  const cv  = $('legendBar');
  const ctx = cv.getContext('2d');
  for (let x = 0; x < cv.width; x++) {
    const [r, g, b] = jetRGB(x / (cv.width - 1));
    ctx.fillStyle = `rgb(${(r*255)|0},${(g*255)|0},${(b*255)|0})`;
    ctx.fillRect(x, 0, 1, cv.height);
  }
  $('legendMin').textContent = fmtNum(vMin);
  $('legendMid').textContent = fmtNum((vMin + vMax) / 2);
  $('legendMax').textContent = fmtNum(vMax);
}

// ── 加载模型 ──────────────────────────────────────────────────────────────
$('btnLoad').addEventListener('click', async () => {
  BASE = $('baseUrl').value.replace(/\/$/, '');
  const path = $('jsonPath').value.trim();
  if (!path) { setStatus('请填写 JSON 文件路径', 'err'); return; }

  setStatus('正在注册模型…');
  try {
    // 1. POST /api/modal/load — 注册文件路径，得到 model_id
    const loadRes  = await fetch(`${BASE}/api/modal/load`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ path }),
    });
    const loadBody = await loadRes.json();
    if (!loadRes.ok) throw new Error(loadBody.detail || `HTTP ${loadRes.status}`);
    MODEL_ID = loadBody.model_id;

    // 2. GET /geometry — 节点坐标 + 三角化索引
    setStatus('加载几何数据…');
    const geoRes  = await fetch(`${BASE}/api/modal/${MODEL_ID}/geometry`);
    const geoBody = await geoRes.json();
    if (!geoRes.ok) throw new Error(geoBody.detail || `HTTP ${geoRes.status}`);
    originPos = new Float32Array(geoBody.data.originPos);
    indexArr  = new Int32Array(geoBody.data.index);
    edgesArr  = new Int32Array(geoBody.data.edges);

    // 3. GET /modes — 模态下拉
    const modRes  = await fetch(`${BASE}/api/modal/${MODEL_ID}/modes`);
    const modBody = await modRes.json();
    if (!modRes.ok) throw new Error(modBody.detail || `HTTP ${modRes.status}`);
    modesList = modBody.data;   // [{label, value}]

    const modeSel = $('modeSelect');
    modeSel.innerHTML = '';
    for (const m of modesList) {
      const opt = document.createElement('option');
      opt.value       = m.value;
      opt.textContent = m.label;
      modeSel.appendChild(opt);
    }
    curOrder = modesList[0]?.value ?? 1;

    // 4. GET /components — 分量下拉
    const cpRes  = await fetch(`${BASE}/api/modal/${MODEL_ID}/components`);
    const cpBody = await cpRes.json();
    if (!cpRes.ok) throw new Error(cpBody.detail || `HTTP ${cpRes.status}`);
    compLabels = cpBody.data;   // ["U-Modulus:usum", ...]

    const compSel = $('componentSelect');
    compSel.innerHTML = '';
    for (const c of compLabels) {
      const opt = document.createElement('option');
      opt.value       = c;
      opt.textContent = c;
      compSel.appendChild(opt);
    }
    curComp  = compLabels[0] || 'usum';
    curScale = 1.0;
    $('scaleSlider').value    = '1';
    $('scaleVal').textContent = '1.00';

    // 更新信息卡
    $('iModelId').textContent = MODEL_ID;
    $('iModes').textContent   = modesList.length;
    $('infoCard').style.display = 'flex';
    $('ctrlCard').style.display = 'flex';

    // 5. 清空缓存，建立 Three.js mesh
    for (const k in animCache) delete animCache[k];
    buildMesh();
    await applyView();

    setStatus(`加载成功：${MODEL_ID}（${modesList.length} 阶）`, 'ok');
  } catch (e) {
    setStatus('加载失败：' + e.message, 'err');
  }
});

// ── 控件事件 ──────────────────────────────────────────────────────────────
$('modeSelect').addEventListener('change', () => {
  curOrder = parseInt($('modeSelect').value);
  applyView();
});

$('componentSelect').addEventListener('change', () => {
  curComp = $('componentSelect').value;
  if (viewMode === 'colormap') applyView();
});

// 视图模式 tabs
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    viewMode = btn.dataset.view;

    $('componentSelect').disabled = (viewMode !== 'colormap');
    $('scaleRow').style.display   = (viewMode === 'deformed') ? 'flex' : 'none';

    applyView();
  });
});

// Scale 滑块（客户端实时，不重新请求）
$('scaleSlider').addEventListener('input', () => {
  curScale = parseFloat($('scaleSlider').value);
  $('scaleVal').textContent = curScale.toFixed(2);

  if (viewMode === 'deformed' && MODEL_ID && mesh && animCache[curOrder]) {
    const anim = animCache[curOrder];
    applyDeformedPos(anim.real, anim.scaleFactor * curScale);
    posAttr.needsUpdate = true;
    mesh.geometry.computeVertexNormals();
    const mLabel = modesList.find(m => m.value === curOrder)?.label || `Order ${curOrder}`;
    $('modeLabel').textContent = `${mLabel}  ×${curScale.toFixed(2)}`;
  }
});

// ── 启动 ──────────────────────────────────────────────────────────────────
initThree();
</script>
</body>
</html>
